server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:warehouse_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: false

jwt:
  secret: WarehouseOsJwtSecretKey2024VeryLongSecretForHmacSha256Algorithm
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

file:
  upload-dir: ${java.io.tmpdir}/warehouse-test-uploads

logging:
  level:
    root: WARN
    com.warehouse: WARN
